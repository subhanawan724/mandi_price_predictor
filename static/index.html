<!DOCTYPE html>
<html>
<head>
    <title>Mandi Market Intelligence & Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Mandi Market Intelligence System</h1>

   
    <div class="analytics-container"">
        <h3>7-Day Market Intelligence Trend</h3>
        
        <div class="filters-bar">
            <label>Mandi:</label>
            <select id="mandiFilter" onchange="applyFiltersAndRender()">
                <option value="all">All Mandis</option>
            </select>

            <label>Crop:</label>
            <select id="cropFilter" onchange="applyFiltersAndRender()">
                <option value="all">All Crops</option>
            </select>
        </div>

        <div style="position: relative; width: 100%; height: 350px;">
            <canvas id="marketTrendChart"></canvas>
        </div>
    </div>

    <hr>

   
    <div class="trader-container" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
        <h2>Trader Prediction Panel</h2>

        <div class="trader-form-grid">

        <label>Crop Item Name:</label><br>
        <input type="text" id="itemInput" placeholder="fruit or veg"><br><br>

        <label>Mandi Location:</label><br>
        <input type="text" id="mandiInput" placeholder="city"><br><br>

        <label>Wholesale Base Price (PKR):</label><br>
        <input type="number" id="basePriceInput" placeholder="price PKR"><br><br>

        <label>Arrival Trucks:</label><br>
        <input type="number" id="trucksInput" placeholder="trucks"><br><br>

        <label>Average Distance (KM):</label><br>
        <input type="number" id="distanceInput" placeholder="dis KM"><br><br>

        <label>Demand Index (1 - 10):</label><br>
        <input type="number" id="demandInput" placeholder="demand index"><br><br>
    </div>
        <button onclick="predictTraderMargin()">Predict Prices & Risk</button>

        <h3>Prediction Output:</h3>
        <p id="predictionResult">Fill the details above and click Predict.</p>
    </div>

    <hr>

    
    <div class="admin-security-box" style="border: 1px solid #f00; padding: 15px; margin-top: 20px;">
        <h2>Admin Security Gate</h2>

        
        <div id="adminLockScreen">
            <label>Enter Admin Passcode:</label><br>
            <input type="password" id="adminPasscodeInput" placeholder="Enter secret PIN">
            <button onclick="unlockAdminPanel()">Unlock Admin Panel</button>
        </div>

        
        <div id="adminControls" style="display: none; margin-top: 15px;">
            <h3 style="color: green;">Admin Control Unlocked</h3>
            
            <label>Current Fuel Price: PKR <span id="currentFuel">Loading...</span></label><br><br>
            
            <input type="number" id="fuelInput" placeholder="Enter new fuel price">
            <button onclick="sendFuelPrice()">Update Fuel Rate</button>

            <p id="adminResultText"></p>
        </div>
    </div>

   
    <script>
        
        let verifiedAdminKey = "";

        
        function unlockAdminPanel() {
            let enteredKey = document.getElementById('adminPasscodeInput').value;
            if (!enteredKey) {
                alert("Please enter passcode!");
                return;
            }

           
            verifiedAdminKey = enteredKey;

            
            document.getElementById('adminControls').style.display = 'block';
            
            
            loadCurrentFuel();
        }

        
        async function loadCurrentFuel() {
            try {
                let response = await fetch('/admin/config');
                let data = await response.json();
                document.getElementById('currentFuel').innerText = data.fuel_price_pkr;
            } catch (error) {
                console.error("Error loading config:", error);
            }
        }

        
        async function sendFuelPrice() {
            let priceValue = document.getElementById('fuelInput').value;

            if (!priceValue) {
                alert("Please enter fuel price!");
                return;
            }

            try {
                let response = await fetch('/admin/update-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fuel_price_pkr: parseFloat(priceValue),
                        secret_key: verifiedAdminKey // Passcode sent to backend
                    })
                });

                let data = await response.json();

                
                if (response.status === 401) {
                    document.getElementById('adminResultText').innerText = "Access Denied: " + data.detail;
                    document.getElementById('adminResultText').style.color = "red";
                } else {
                    document.getElementById('adminResultText').innerText = "Status: " + data.message;
                    document.getElementById('adminResultText').style.color = "green";
                    document.getElementById('currentFuel').innerText = data.current_config.fuel_price_pkr;
                }

            } catch (error) {
                document.getElementById('adminResultText').innerText = "Error updating fuel rate!";
            }
        }

        
        async function predictTraderMargin() {
            let item = document.getElementById('itemInput').value.trim().toLowerCase();
            let mandi = document.getElementById('mandiInput').value.trim().toLowerCase();
            let basePrice = parseFloat(document.getElementById('basePriceInput').value);
            let trucks = parseInt(document.getElementById('trucksInput').value);
            let distance = parseFloat(document.getElementById('distanceInput').value);
            let demand = parseInt(document.getElementById('demandInput').value);

            if (!item || !mandi || isNaN(basePrice) || isNaN(trucks) || isNaN(distance) || isNaN(demand)) {
                alert("Please fill all input fields properly!");
                return;
            }

            try {
                let response = await fetch('/trader-predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        item: item,
                        mandi_location: mandi,
                        wholesale_base_price: basePrice,
                        arrival_trucks: trucks,
                        avg_distance_km: distance,
                        demand_index: demand
                    })
                });

                let data = await response.json();

                document.getElementById('predictionResult').innerHTML = 
                    "<b>Item:</b> " + data.item + " | <b>Mandi:</b> " + data.mandi + "<br>" +
                    "<b>Live Temp:</b> " + data.live_weather.temperature_c + "°C | " +
                    "<b>Rainfall:</b> " + data.live_weather.rainfall_mm + " mm<br>" +
                    "<b>Auto Perishability:</b> " + data.auto_detected_perishability + "<br>" +
                    "<b>Spoilage Risk:</b> " + data.predicted_spoilage_risk + "<br>" +
                    "<b>Predicted Retail Price:</b> PKR " + data.predicted_retail_price_pkr + "<br>" +
                    "<b>Estimated Trader Margin:</b> PKR " + data.estimated_trader_margin_pkr;

                
                if (typeof initAnalyticsDashboard === "function") {
                    initAnalyticsDashboard();
                }

            } catch (error) {
                document.getElementById('predictionResult').innerText = "Error getting prediction!";
            }
        }
    </script>

  
    <script src="chart_analytics.js"></script>

</body>
</html>
